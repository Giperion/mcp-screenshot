name: build

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release

      - name: Publish win-x64
        run: dotnet publish src/ScreenshotMcp -c Release -r win-x64 -o artifacts/win-x64

      - name: Publish win-arm64
        run: dotnet publish src/ScreenshotMcp -c Release -r win-arm64 -o artifacts/win-arm64

      - uses: actions/upload-artifact@v5
        with:
          name: ScreenshotMcp-win-x64
          path: artifacts/win-x64

      - uses: actions/upload-artifact@v5
        with:
          name: ScreenshotMcp-win-arm64
          path: artifacts/win-arm64
